name: Sync with upstream

on:
  schedule:
    - cron: '0 3 * * *'   # every day at 03:00 UTC
  workflow_dispatch:       # allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0   # important for rebase

      - name: Set up Git
        run: |
          git config user.name "GitHub Action"
          git config user.email "actions@github.com"

      - name: Add upstream
        run: git remote add upstream https://github.com/kubernetes/kubernetes.git

      - name: Fetch upstream
        run: git fetch upstream

      # Check if experiments are paused
      - name: Check pause status
        id: check_pause
        run: |
          if [ -f ".pause-experiments" ]; then
            echo "paused=true" >> $GITHUB_OUTPUT
            echo "⏸️ Experiments are paused"
          else
            echo "paused=false" >> $GITHUB_OUTPUT
            echo "▶️ Experiments will sync normally"
          fi

      - name: Update main (rebase with auto-conflict resolution)
        run: |
          git checkout main
          set +e
          git rebase upstream/master || (
            echo "Conflict detected — preferring upstream changes"
            git checkout --theirs .
            git add -A
            git rebase --continue || (git rebase --abort && exit 1)
          )
          set -e
          git push --force-with-lease origin main

      - name: Update test-experiments (rebase with auto-conflict resolution)
        if: steps.check_pause.outputs.paused == 'false'
        run: |
          git checkout test-experiments
          set +e
          git rebase upstream/master || (
            echo "Conflict detected — preferring upstream changes"
            git checkout --theirs .
            git add -A
            git rebase --continue || (git rebase --abort && exit 1)
          )
          set -e
          git push --force-with-lease origin test-experiments

      - name: Skip test-experiments sync
        if: steps.check_pause.outputs.paused == 'true'
        run: echo "⏸️ Experiments paused - skipping test-experiments sync"

  notify:
    needs: sync
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "GitHub Actions Sync Failed"
          to: ${{ secrets.ALERT_EMAIL }}
          from: "GitHub Actions <${{ secrets.EMAIL_USERNAME }}>"
          body: |
            The daily sync with upstream failed.
            Please check the Actions logs for details:
            https://github.com/${{ github.repository }}/actions
